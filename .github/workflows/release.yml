# Release on v* tags: linux binaries for amd64 and arm64, a multi-arch image
# and the Helm chart on GHCR, and a GitHub release with the changelog entry.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FDB_VERSION: "7.3.77"
  IMAGE: ghcr.io/${{ github.repository_owner }}/kine-fdb

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./hack/release/check.sh "${GITHUB_REF_NAME}"

  build:
    name: Build (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FoundationDB client
        run: ./hack/ci/install-fdb.sh
      - name: Binaries
        run: |
          make build VERSION=${GITHUB_REF_NAME} COMMIT=${GITHUB_SHA::12}
          dir=kine-fdb_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}
          mkdir -p dist/$dir
          cp bin/kine-fdb bin/kine-fdb-admin LICENSE README.md dist/$dir/
          tar -C dist -czf dist/$dir.tar.gz $dir
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*.tar.gz
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            FDB_VERSION=${{ env.FDB_VERSION }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          version=${GITHUB_REF_NAME#v}
          tags=(-t "${IMAGE}:${version}")
          if [[ "${version}" != *-* ]]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE}@sha256:%s " *)
      - uses: azure/setup-helm@v5
      - name: Helm chart
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package charts/kine-fdb --version "${version}" --app-version "${version}" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/kine-fdb-${version}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum *.tar.gz *.tgz > SHA256SUMS && cd ..
          section() { awk -v v="$1" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md; }
          section "${GITHUB_REF_NAME#v}" > dist/NOTES.md
          # Pre-releases have no section of their own yet.
          [[ -s dist/NOTES.md ]] || section Unreleased > dist/NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: dist/NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.tgz
            dist/SHA256SUMS
