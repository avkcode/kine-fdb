{{/* ServiceAccount for kine-fdb pods; they need no Kubernetes API access. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kine-fdb.serviceAccountName" . }}
  labels:
    {{- include "kine-fdb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
